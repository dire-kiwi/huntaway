[package]
name = "huntaway"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[workspace]
members = [".", "shim", "broker"]
default-members = [".", "shim", "broker"]

[dependencies]
anyhow = "1.0.104"
# HMAC-SHA256 for webhook signatures (already built for rustls).
aws-lc-rs = { version = "1.18.2", default-features = false }
axum = { version = "0.8.9", features = ["ws", "macros"] }
base64 = "0.23.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
futures = "0.3.34"
huntaway-broker = { path = "broker" }
hyper = "1"
libc = "0.2.191"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_urlencoded = "0.7"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["v4"] }
