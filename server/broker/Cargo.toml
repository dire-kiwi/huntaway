[package]
name = "huntaway-broker"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Connection broker for Huntaway hosts: managed Cloudflare endpoints or a legacy relay"

[lib]
path = "src/lib.rs"

[[bin]]
name = "huntaway-broker"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
# Hashes of hosts' keys, for the state file (`--state`).
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
# The version axum uses, as in ../Cargo.toml, so the workspace has one tungstenite stack.
tokio-tungstenite = "0.29.0"
