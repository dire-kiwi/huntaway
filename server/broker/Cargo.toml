[package]
name = "huntaway-broker"
version = "0.1.0"
edition = "2024"
description = "Public relay for Huntaway hosts: hosts dial out to it, and browsers and hubs reach them through it"

[lib]
path = "src/lib.rs"

[[bin]]
name = "huntaway-broker"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
