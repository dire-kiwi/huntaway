<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Frames hold only the board's own pages: an agent's HTML document (a srcdoc frame, see components/task/htmlFrame.ts)
         can't load another host's page by navigating its frame there. Chrome (not Electron) still looks the host up and
         connects to it (TLS SNI included) before refusing, unless its "Preload pages" setting is off, so the hostname
         can still carry data out (HA-269), as it does for a <link rel=preconnect> in the document. Nothing the board
         sets stops that. -->
    <meta http-equiv="Content-Security-Policy" content="frame-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0b0b0e" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Installed on an iPhone's home screen: full screen, the page drawing under the status bar (index.css keeps clear of it). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Huntaway" />
    <title>Huntaway</title>
    <!-- The board's one stylesheet (Tailwind and the theme), here rather than imported by main.tsx for its side effect. -->
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
