packages:
  - apps/*
  - packages/*

# Exact versions, one for the whole workspace (docs/plan/02-repository.md). `effect/rpc`, `effect/sql`, `effect/http`
# and the other unstable modules may break in a minor release, so an upgrade of `effect` is a change of its own.
catalog:
  effect: 4.1.4
  "@effect/platform-node": 4.1.3
  "@effect/platform-browser": 4.1.3
  "@effect/sql-sqlite-node": 4.1.3
  "@effect/atom-react": 4.1.3
  "@effect/vitest": 4.1.3
  "@effect/tsgo": 0.67.7
  "@types/node": 24.19.2
  typescript: 7.0.2
  vite-plus: 1.5.0
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  playwright: 1.64.1
  playwright-core: 1.64.1
  # 6.3: documents' images to AVIF (apps/server/src/docs/DocImages.ts).
  sharp: 0.35.5

# Vite+ (`vp`) bundles the Vite and Vitest every package gets.
overrides:
  vite@*: npm:@voidzero-dev/vite-plus-core@1.5.0
  vitest@*: 5.1.0
peerDependencyRules:
  allowAny:
    - vite

allowBuilds:
  "@parcel/watcher": false
  electron-winstaller: false
