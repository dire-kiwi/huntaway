# site-deploy bundle for the broker (filled in by bundle.sh).
x-site-deploy:
  domain: "@DOMAIN@"
  service: broker
  port: 8080
  # Hosts hold a websocket open all the time; the broker must never be suspended under them.
  idle_timeout: 0

services:
  broker:
    image: debian:bookworm-slim
    init: true
    command: [/app/huntaway-broker, --host, 0.0.0.0, --port, "8080"]
    env_file: ./broker.env
    volumes:
      - ./app:/app:ro
    mem_limit: 128m
    healthcheck:
      test: [CMD, bash, -c, "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
