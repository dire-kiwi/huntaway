# Runs the server and UI tests, the browser checks in app/tests/ui and scripts/ia-api's tests on each pull request, on
# GitHub-hosted runners. It needs no secrets, so pull requests from forks run it too. Deployments live outside this repository.
name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Two pull requests that were each green against an older master can still break it together.
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Incremental state only helps rebuilds of the same code, and is about half the size of a debug build.
      CARGO_INCREMENTAL: "0"
      # sccache isn't installed here; server/.cargo/rustc-wrapper runs rustc directly without it.
      SCCACHE_DISABLE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server

      # The binaries first, so that cargo test doesn't compile them alongside the server's test binary
      # (two rustcs at once peak at about 2.9G).
      - name: cargo build
        working-directory: server
        run: cargo build --locked

      # Each test binary runs in a TMPDIR of its own and fails if it leaves anything in it (server/.cargo/test-runner).
      - name: cargo test
        working-directory: server
        run: cargo test --locked

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: npm ci
        working-directory: app
        run: npm ci --no-audit --no-fund

      # npm ci doesn't mind a package-lock.json that's behind package.json, but npm install
      # rewrites it, which leaves the checkout of a host that builds it with uncommitted changes.
      - name: package-lock.json is up to date
        working-directory: app
        run: npm install --no-audit --no-fund --ignore-scripts && git diff --exit-code package-lock.json

      - name: Typecheck
        working-directory: app
        run: npm run typecheck

      - name: npm test
        working-directory: app
        run: npm test

  # The browser checks in app/tests/ui (`npm run test:ui`, which builds the UI first and runs 8 files at a time) against a
  # debug server, and scripts/ia-api's tests.
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      SCCACHE_DISABLE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: npm ci
        working-directory: app
        run: npm ci --no-audit --no-fund

      # The runners have no /usr/bin/chromium, so scripts/ui-check.mjs falls back to Playwright's own Chromium (not its
      # headless shell, which has no notifications or push).
      - name: Chromium
        working-directory: app
        run: npx playwright-core install --with-deps --no-shell chromium

      # Only the binaries the checks run, with no test binary beside them (see the server job's note on memory).
      - name: cargo build
        working-directory: server
        run: cargo build --locked

      - name: Browser checks
        working-directory: app
        run: npm run test:ui

      # What the page showed when a step failed (scripts/ui-check.mjs saves it).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: ui-check-failures
          path: /tmp/ui-check-*-failed.png
          if-no-files-found: ignore
          retention-days: 7

      - name: ia-api tests
        run: python3 scripts/ia-api-test.py
