# Runs the checks and tests on each pull request: `vp check` (format, lint and type checks over the workspace), the
# server's and the web app's unit tests (Vitest), the mobile app's (Jest), the browser checks in apps/web/tests/ui against
# the server (apps/server), scripts' own tests, and `cargo test` for what stays in Rust (rust/: ia-shim and the broker).
# It needs no secrets, so pull requests from forks run it too. Deployments live outside this repository.
#
# The owner's own jobs can run on self-hosted runners (labels self-hosted and huntaway), which keep their checkout, build
# output and toolchains between jobs: set the repository variable SELF_HOSTED_USER to the owner's login. Those are pushes
# and dispatches by them, and pull requests they opened from a branch of this repository (not a fork), started or re-run by
# them. Everything else, and every job while the variable isn't set, runs on GitHub-hosted runners. A pull request's
# workflow comes from its own branch, so the runners must also refuse other jobs themselves; this choice is only routing.
name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Two pull requests that were each green against an older master can still break it together.
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The Rust workspace (the root's Cargo.toml, crates in rust/): ia-shim, which the server runs agents under, and the broker.
  rust:
    runs-on: &runs-on >-
      ${{ (vars.SELF_HOSTED_USER != '' && github.actor == vars.SELF_HOSTED_USER && github.triggering_actor == vars.SELF_HOSTED_USER
      && (github.event_name != 'pull_request' || (github.event.pull_request.user.login == vars.SELF_HOSTED_USER
      && github.event.pull_request.head.repo.full_name == github.repository)))
      && fromJSON('["self-hosted", "huntaway"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      # Incremental state only helps rebuilds of the same code, and is about half the size of a debug build.
      CARGO_INCREMENTAL: "0"
      # sccache isn't installed here; .cargo/rustc-wrapper runs rustc directly without it.
      SCCACHE_DISABLE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A self-hosted runner's checkout keeps the ignored build output (target/, node_modules) of earlier jobs, so
          # builds are incremental; the next step removes untracked files, as clean does.
          clean: ${{ runner.environment == 'github-hosted' }}

      - name: Tidy the checkout
        if: runner.environment == 'self-hosted'
        run: &tidy |
          git clean -ffd
          # Earlier jobs' screenshots of failed ui steps, which the ui job uploads.
          rm -f /tmp/ui-check-*-failed.png
          # Builds of many branches pile up in the target directory: start again once it's over 20G.
          if [ -d target ] && [ "$(du -sm target | cut -f1)" -gt 20480 ]; then rm -rf target; fi

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      # Self-hosted runners keep their target directory instead.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: runner.environment == 'github-hosted'

      # Each test binary runs in a TMPDIR of its own and fails if it leaves anything in it (.cargo/test-runner).
      - name: cargo test
        run: cargo test --locked

  # Format, lint and type checks over the whole workspace (the root's vite.config.ts), with the lockfile checked against
  # the packages' manifests (pnpm install in CI won't change it). Always on a GitHub-hosted runner, as are the server,
  # web and mobile jobs: they're quick, and leave the self-hosted ones to the rust and ui jobs.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Vite+ (the version in pnpm-workspace.yaml's catalog), Node 24 and pnpm, and `vp install`.
      - uses: &setup-vp voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with: &setup-vp-with
          node-version: 24
          cache: true

      - name: vp check
        run: vp check

  # The server (apps/server): its unit and integration tests.
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: "0"
      SCCACHE_DISABLE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: *setup-vp
        with: *setup-vp-with

      # The broker tests run the Rust broker (its test_broker example, see apps/server/src/hosts/broker/test_broker.ts).
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: server

      - name: Build the test broker
        run: cargo build --locked -p huntaway-broker --example test_broker

      - name: vp test
        working-directory: apps/server
        run: vp test

  # The web app's unit tests (apps/web/tests), which cover packages/client too.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: *setup-vp
        with: *setup-vp-with

      - name: vp test
        working-directory: apps/web
        run: vp test

  # The mobile app (apps/mobile): its typecheck with the TypeScript Expo builds it with (vp check covers it as well), and
  # its Jest tests.
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: *setup-vp
        with: *setup-vp-with

      - name: Typecheck
        working-directory: apps/mobile
        run: pnpm run typecheck

      - name: Jest
        working-directory: apps/mobile
        run: pnpm test --ci

  # The browser checks in apps/web/tests/ui (`pnpm run test:ui`, which builds the UI first) against the server
  # (apps/server, as scripts/test-server.sh runs it, with a debug ia-shim), and the scripts' tests. They're split between
  # three runners, each running 4 files at a time on a GitHub-hosted one (it has 4 CPUs, and Chromium keeps them busy:
  # more at once only made each check slower) and 2 on a self-hosted one (2 CPUs).
  ui:
    name: ui (${{ matrix.shard }}/3)
    runs-on: *runs-on
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      CARGO_INCREMENTAL: "0"
      SCCACHE_DISABLE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: ${{ runner.environment == 'github-hosted' }}

      - name: Tidy the checkout
        if: runner.environment == 'self-hosted'
        run: *tidy

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      # Self-hosted runners keep their target directory instead.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: runner.environment == 'github-hosted'

      - uses: *setup-vp
        with: *setup-vp-with

      # The runners have no /usr/bin/chromium, so scripts/ui-check.mjs falls back to Playwright's own Chromium (not its
      # headless shell, which has no notifications or push). Self-hosted runners have its system libraries already.
      - name: Chromium
        working-directory: apps/web
        run: pnpm exec playwright-core install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} --no-shell chromium

      # The server runs its agents under the Rust ia-shim.
      - name: Build ia-shim
        run: cargo build --locked -p ia-shim

      - name: Browser checks
        working-directory: apps/web
        run: pnpm run test:ui --shard=${{ matrix.shard }}/3
        env:
          IA_UI_TEST_JOBS: ${{ runner.environment == 'github-hosted' && '4' || '2' }}

      # What the page showed when a step failed (scripts/ui-check.mjs saves it).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: ui-check-failures-${{ matrix.shard }}
          path: /tmp/ui-check-*-failed.png
          if-no-files-found: ignore
          retention-days: 7

      - name: ia-api tests
        if: matrix.shard == 1
        run: python3 scripts/ia-api-test.py

      - name: install-release-host tests
        run: sh scripts/install-release-host-test.sh

      - name: copy-live-board tests
        if: matrix.shard == 1
        run: bash scripts/copy-live-board-test.sh
