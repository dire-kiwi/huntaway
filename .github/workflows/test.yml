# Runs the server and UI tests, the browser checks in app/tests/ui and scripts/ia-api's tests on each pull request. It needs
# no secrets, so pull requests from forks run it too. Deployments live outside this repository.
#
# The owner's own jobs can run on self-hosted runners (labels self-hosted and huntaway), which keep their checkout, build
# output and toolchains between jobs: set the repository variable SELF_HOSTED_USER to the owner's login. Those are pushes
# and dispatches by them, and pull requests they opened from a branch of this repository (not a fork), started or re-run by
# them. Everything else, and every job while the variable isn't set, runs on GitHub-hosted runners. A pull request's
# workflow comes from its own branch, so the runners must also refuse other jobs themselves; this choice is only routing.
name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Two pull requests that were each green against an older master can still break it together.
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: &runs-on >-
      ${{ (vars.SELF_HOSTED_USER != '' && github.actor == vars.SELF_HOSTED_USER && github.triggering_actor == vars.SELF_HOSTED_USER
      && (github.event_name != 'pull_request' || (github.event.pull_request.user.login == vars.SELF_HOSTED_USER
      && github.event.pull_request.head.repo.full_name == github.repository)))
      && fromJSON('["self-hosted", "huntaway"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      # Incremental state only helps rebuilds of the same code, and is about half the size of a debug build.
      CARGO_INCREMENTAL: "0"
      # sccache isn't installed here; server/.cargo/rustc-wrapper runs rustc directly without it.
      SCCACHE_DISABLE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A self-hosted runner's checkout keeps the ignored build output (server/target, app/node_modules) of earlier
          # jobs, so builds are incremental; the next step removes untracked files, as clean does.
          clean: ${{ runner.environment == 'github-hosted' }}

      - name: Tidy the checkout
        if: runner.environment == 'self-hosted'
        run: |
          git clean -ffd
          # Earlier jobs' screenshots of failed ui steps, which the ui job uploads.
          rm -f /tmp/ui-check-*-failed.png
          # Builds of many branches pile up in the target directory: start again once it's over 20G.
          if [ -d server/target ] && [ "$(du -sm server/target | cut -f1)" -gt 20480 ]; then rm -rf server/target; fi

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      # Self-hosted runners keep their target directory instead.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: runner.environment == 'github-hosted'
        with:
          workspaces: server

      # The binaries first, so that cargo test doesn't compile them alongside the server's test binary
      # (two rustcs at once peak at about 2.9G).
      - name: cargo build
        working-directory: server
        run: cargo build --locked

      # Each test binary runs in a TMPDIR of its own and fails if it leaves anything in it (server/.cargo/test-runner).
      - name: cargo test
        working-directory: server
        run: cargo test --locked

  # Always on a GitHub-hosted runner: it's quick, and leaves the self-hosted ones to the server and ui jobs.
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: npm ci
        working-directory: app
        run: npm ci --no-audit --no-fund

      # npm ci doesn't mind a package-lock.json that's behind package.json, but npm install
      # rewrites it, which leaves the checkout of a host that builds it with uncommitted changes.
      - name: package-lock.json is up to date
        working-directory: app
        run: npm install --no-audit --no-fund --ignore-scripts && git diff --exit-code package-lock.json

      - name: Typecheck
        working-directory: app
        run: npm run typecheck

      - name: npm test
        working-directory: app
        run: npm test

  # The browser checks in app/tests/ui (`npm run test:ui`, which builds the UI first) against a debug server, split
  # across three jobs (UI_SHARD), and scripts/ia-api's tests.
  ui:
    name: ui (${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: *runs-on
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      SCCACHE_DISABLE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A self-hosted runner's checkout keeps the ignored build output (server/target, app/node_modules) of earlier
          # jobs, so builds are incremental; the next step removes untracked files, as clean does.
          clean: ${{ runner.environment == 'github-hosted' }}

      - name: Tidy the checkout
        if: runner.environment == 'self-hosted'
        run: |
          git clean -ffd
          # Earlier jobs' screenshots of failed ui steps, which the ui job uploads.
          rm -f /tmp/ui-check-*-failed.png
          # Builds of many branches pile up in the target directory: start again once it's over 20G.
          if [ -d server/target ] && [ "$(du -sm server/target | cut -f1)" -gt 20480 ]; then rm -rf server/target; fi

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      # Self-hosted runners keep their target directory instead.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: runner.environment == 'github-hosted'
        with:
          workspaces: server

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: npm ci
        working-directory: app
        run: npm ci --no-audit --no-fund

      # The runners have no /usr/bin/chromium, so scripts/ui-check.mjs falls back to Playwright's own Chromium (not its
      # headless shell, which has no notifications or push). Self-hosted runners have its system libraries already.
      - name: Chromium
        working-directory: app
        run: npx playwright-core install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} --no-shell chromium

      # Only the binaries the checks run, with no test binary beside them (see the server job's note on memory).
      - name: cargo build
        working-directory: server
        run: cargo build --locked

      - name: Browser checks
        working-directory: app
        env:
          UI_SHARD: ${{ matrix.shard }}/3
        run: npm run test:ui

      # What the page showed when a step failed (scripts/ui-check.mjs saves it).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: ui-check-failures-${{ matrix.shard }}
          path: /tmp/ui-check-*-failed.png
          if-no-files-found: ignore
          retention-days: 7

      - name: ia-api tests
        if: matrix.shard == 1
        run: python3 scripts/ia-api-test.py
