# Builds the desktop app (apps/web/package.json's `build`) and the server for Linux and macOS, and the mobile app's Android
# APK (once its signing key's secrets are set), when a GitHub release is published, and attaches them to that release.
# The server is the TypeScript one (apps/server, HA-174), packaged with the Node that runs it and the Rust ia-shim by
# scripts/package-server.sh; a host on an earlier (Rust) release updates onto it as onto any release, and the server
# backs up its database as it starts on a new version (apps/server/src/backup.ts), which is also what makes a Roll back
# onto a Rust release (0.3.x) safe. The release's tag is the version (v1.2.3 → 1.2.3), so it must be semver with an
# optional leading v. Running it by hand (Actions → Release → Run workflow) builds an existing release's tag again and
# replaces its files. Nothing else runs it (HA-244): pull requests don't build the release, so a change to the packaging
# is first built by the release that ships it (or by hand, on a tag of its own). Only the attach job can write to the
# repository.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the release to build and attach the files to
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
            arch: x64
          - runner: macos-latest
            os: mac
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      SCCACHE_DISABLE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      # fpm writes the Arch package's .MTREE with bsdtar.
      - name: bsdtar
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      # The app's version, and (through VERSION, which scripts/package-server.sh reads) the server's (`huntaway --version`).
      - name: Version
        working-directory: apps/web
        run: |
          version="${TAG#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          npm version --no-git-tag-version --allow-same-version "$version"

      - name: npm ci
        run: npm ci --no-audit --no-fund -w huntaway-app -w @huntaway/server --include-workspace-root

      # The UI, and ia-shim, the Rust supervisor the server runs agents under (the other crate, the broker, is deployed on
      # its own).
      - name: Build
        run: npm run build -w huntaway-app && cargo build --release --locked -p ia-shim

      # The server the desktop app and the server tarball carry: the TypeScript server, the Node this job runs on (the
      # runner's own os and arch), ia-shim and the UI, in release-server/ (see the script). IA_BUILD_COMMIT: the server
      # reports the commit it was built from, as a checkout does (a hub that updates itself to a release goes by it to
      # update hosts, and hosts that follow the hub with --update-from too).
      - name: Package the TypeScript server
        run: IA_BUILD_COMMIT=$(git rev-parse HEAD) scripts/package-server.sh release-server "$(command -v node)"

      # It answers --version with the release's version (what a host installing it checks), and starts and serves. Its
      # server is compiled to .js, which Node runs without loading its TypeScript compiler (HA-181).
      - name: Check the packaged server
        run: |
          [ -f release-server/server-ts/src/main.js ] && [ -z "$(find release-server/server-ts/src -name '*.ts')" ] ||
            { echo "expected the server compiled to .js"; exit 1; }
          out=$(release-server/huntaway --version)
          echo "$out"
          [ "$out" = "huntaway $VERSION" ] || { echo "expected huntaway $VERSION"; exit 1; }
          # issue-agent, the name from before the rename, runs it too.
          [ "$(release-server/issue-agent --version)" = "huntaway $VERSION" ] || { echo "issue-agent doesn't run huntaway"; exit 1; }
          data=$(mktemp -d)
          IA_CLAUDE_BIN=/bin/false IA_CODEX_BIN=/bin/false release-server/huntaway serve --host 127.0.0.1 --port 0 --data-dir "$data" --demo > "$data/out" 2> "$data/log" &
          pid=$!
          for _ in $(seq 60); do grep -q '^IA_READY' "$data/out" && break; sleep 1; done
          port=$(sed -n 's/^IA_READY {"port":\([0-9]*\).*/\1/p' "$data/out")
          [ -n "$port" ] || { cat "$data/log"; exit 1; }
          curl -fsS "http://127.0.0.1:$port/api/health"
          curl -fsS "http://127.0.0.1:$port/" | grep -q '<html'
          curl -fsS -H "Authorization: Bearer $(cat "$data/auth_token")" "http://127.0.0.1:$port/api/info"
          kill "$pid"
          wait "$pid" || true

      # Linux: an AppImage and an Arch package. macOS: a dmg and a zip, ad-hoc signed (there's no Developer ID): every
      # binary in it, node and ia-shim too, is signed again ad hoc, without the hardened runtime, and the checks below
      # see the app the release ships (HA-185).
      - name: Package the desktop app
        working-directory: apps/web
        run: npx electron-builder --${{ matrix.os }} --${{ matrix.arch }} --publish never

      # The server the packaged app starts from its resources.
      - name: Check the desktop app's server
        working-directory: apps/web
        run: |
          if [ "${{ matrix.os }}" = mac ]; then res=$(echo release/mac*/Huntaway.app/Contents/Resources); else res=release/linux-unpacked/resources; fi
          ls "$res"
          [ "$("$res/huntaway" --version)" = "huntaway $VERSION" ]
          [ -f "$res/server-ts/node_modules/ws/package.json" ] && [ -x "$res/ia-shim" ] && [ -x "$res/issue-agent" ] && [ -f "$res/ui/index.html" ]

      # The packaged app, started as a user starts it (HA-185): its window loads the board from the server it starts
      # from its resources, with their Node; an agent runs a turn under their ia-shim, and the MCP helper answers.
      - name: Start the desktop app
        run: |
          if [ "${{ matrix.os }}" = mac ]; then exe=$(echo apps/web/release/mac*/Huntaway.app/Contents/MacOS/Huntaway); else exe=apps/web/release/linux-unpacked/huntaway-desktop; fi
          node scripts/desktop-app-check.mjs "$exe" --version "$VERSION"

      # How macOS sees the app: electron-builder signs it ad hoc (identity "-", no hardened runtime) and nothing is
      # notarized, so Gatekeeper rejects a downloaded copy until the user allows it (System Settings → Privacy & Security
      # → Open Anyway, or `xattr -dr com.apple.quarantine`). The server tarball's node keeps the Node.js Foundation's
      # signature. For the record, nothing here fails the build: the step writes what codesign and spctl say as a notice
      # on the run (the job's log is too long to read back through the API).
      - name: Signatures and Gatekeeper (macOS)
        if: matrix.os == 'mac'
        run: |
          app=$(echo apps/web/release/mac*/Huntaway.app)
          out="$RUNNER_TEMP/signatures.txt"
          {
            echo "macOS $(sw_vers -productVersion); $(spctl --status 2>&1)"
            echo "== spctl --assess (Gatekeeper's verdict on a downloaded copy)"
            spctl --assess --type execute -vv "$app" 2>&1 | sed "s|$PWD/||" || true
            echo "== codesign --verify --deep --strict"
            if v=$(codesign --verify --deep --strict "$app" 2>&1); then echo "valid"; else echo "$v" | sed "s|$PWD/||" | tail -3; fi
            for f in "$app" "$app/Contents/Resources/node/bin/node" "$app/Contents/Resources/ia-shim" release-server/node/bin/node release-server/ia-shim; do
              echo "== ${f#"$PWD/"}"
              codesign -dv --verbose=2 "$f" 2>&1 | grep -E '^(Identifier|CodeDirectory|Authority|Runtime)' || true
            done
          } > "$out"
          cat "$out"
          node -e 'const t = require("node:fs").readFileSync(process.argv[1], "utf8").trim();
            console.log(`::notice title=macOS signatures and Gatekeeper::${t.replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A")}`)' "$out"

      # The same check on a copy marked as downloaded by a browser (com.apple.quarantine on every file), as the dmg or
      # zip unpacks it. A runner may have Gatekeeper's assessments switched off (spctl --status above), and nobody is
      # there to click Open Anyway, so this doesn't fail the build: it says how it went in a notice on the run.
      - name: Start a quarantined copy of the desktop app (macOS)
        if: matrix.os == 'mac'
        run: |
          dl="$RUNNER_TEMP/downloaded"
          mkdir -p "$dl"
          ditto -x -k apps/web/release/*-mac-*.zip "$dl"
          q="0083;$(printf %x "$(date +%s)");Safari;$(uuidgen)"
          find "$dl/Huntaway.app" -exec xattr -w com.apple.quarantine "$q" {} +
          echo "quarantine on node: $(xattr -p com.apple.quarantine "$dl/Huntaway.app/Contents/Resources/node/bin/node")"
          if node scripts/desktop-app-check.mjs "$dl/Huntaway.app/Contents/MacOS/Huntaway" --version "$VERSION"; then
            echo "::notice title=Quarantined desktop app::A copy with com.apple.quarantine on every file started its server and ran an agent ($(spctl --status 2>&1))"
          else
            echo "::warning title=Quarantined desktop app::A copy with com.apple.quarantine on every file didn't pass the check ($(spctl --status 2>&1)): see the step's log"
          fi

      # What an installed app reads to update itself: the version, and the shell stamp (the frame stamp of
      # apps/web/electron/stamp.cjs: boot.cjs and Electron) of the desktop app, which says whether the update needs a new
      # package or only changes the server, the UI and the rest of the shell (boot.cjs loads that from the server's
      # tarball). The stamp is checked against the one the packaged app computes from its app.asar, with its own Electron.
      - name: Release manifest
        if: matrix.os == 'linux'
        working-directory: apps/web
        run: |
          node -e 'const fs = require("node:fs"); const { frameStamp } = require("./electron/stamp.cjs");
            const electron = require("electron/package.json").version;
            const manifest = { version: process.env.VERSION, shell: frameStamp("electron", electron), electron };
            fs.writeFileSync(`release/huntaway-${process.env.VERSION}-release.json`, JSON.stringify(manifest, null, 2) + "\n")'
          cat "release/huntaway-$VERSION-release.json"
          asar="$PWD/release/linux-unpacked/resources/app.asar/electron"
          packaged=$(ELECTRON_RUN_AS_NODE=1 release/linux-unpacked/huntaway-desktop -e \
            "console.log(require('$asar/stamp.cjs').frameStamp('$asar', process.versions.electron))")
          node -e 'const m = require(process.argv[1]); if (m.shell !== process.argv[2]) {
            console.error(`the packaged app has stamp ${process.argv[2]}, the manifest ${m.shell}`); process.exit(1) }' \
            "./release/huntaway-$VERSION-release.json" "$packaged"

      # The server on its own, for hosts: release-server/ (huntaway, which runs the TypeScript server in apps/server/ with
      # the Node in node/, ia-shim, and the UI in ui/ beside them, where the server looks).
      # electron/ is the desktop shell of this release, which an installed app loads once it has updated to it
      # (apps/web/electron/boot.cjs); shell.json says which Electron it was written for and which boot.cjs it needs.
      - name: Package the server
        run: |
          name="huntaway-server-$VERSION-${{ matrix.os }}-${{ matrix.arch }}"
          mkdir -p apps/web/release
          cp -R release-server "apps/web/release/$name"
          mkdir "apps/web/release/$name/electron"
          cp apps/web/electron/*.cjs "apps/web/release/$name/electron/"
          node -e 'const electron = require("electron/package.json").version;
            require("node:fs").writeFileSync(process.argv[1], JSON.stringify({ electron, boot: 1 }) + "\n")' "apps/web/release/$name/electron/shell.json"
          tar -C apps/web/release -czf "apps/web/release/$name.tar.gz" "$name"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: huntaway-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            apps/web/release/*.AppImage
            apps/web/release/*.pacman
            apps/web/release/*.dmg
            apps/web/release/*.zip
            apps/web/release/*.tar.gz
            apps/web/release/*.json
          if-no-files-found: error
          retention-days: 1

  # Whether the Android signing key's secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and
  # ANDROID_KEY_PASSWORD) are set, which a job's `if` can't read itself: a release builds the APK only with them, and
  # skips it until they're set rather than failing.
  android-key:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      set: ${{ steps.key.outputs.set }}
    steps:
      - id: key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "set=true" >> "$GITHUB_OUTPUT"
          else
            echo "set=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=No Android APK::The ANDROID_KEY* secrets aren't all set, so a release has no APK (docs/mobile.md)"
          fi

  # The mobile app's Android APK (apps/mobile), built here with `expo prebuild` and Gradle rather than on EAS: it needs no
  # Expo account or build quota, and the signing key stays in this repository's secrets. ANDROID_KEYSTORE_BASE64 is the
  # keystore (base64 of the .jks), with ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD; Gradle
  # gets them as android.injected.signing.* properties, as Android Studio passes them, so the generated build.gradle
  # needs no changes. A release needs the key, since phones only update an app signed with the same one. Only the 32-
  # and 64-bit ARM builds are in it, which every phone runs; x86 is for emulators. Until the signing key's secrets are
  # set, a release skips this job (see android-key) rather than failing, and has no APK.
  android:
    needs: android-key
    if: ${{ needs.android-key.outputs.set == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      # React Native's Gradle plugin builds with a JDK 17 toolchain. The runner has the Android SDK and NDK; Gradle
      # downloads the versions it's missing.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: npm ci
        run: npm ci --no-audit --no-fund -w @huntaway/mobile

      - name: Version
        working-directory: apps/mobile
        run: |
          version="${TAG#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          node scripts/release-version.js "$version"

      # Firebase's config for push through FCM (Expo's push service hands Android pushes to it), from the optional
      # secret GOOGLE_SERVICES_JSON (the google-services.json of a Firebase app for nz.net.ivan.huntaway). It isn't
      # committed, so app.json names it only here, where it exists: prebuild fails on a missing file. Without it the
      # app builds and runs, but can't register for push on Android.
      - name: google-services.json
        working-directory: apps/mobile
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::warning::No GOOGLE_SERVICES_JSON secret: this APK can't register for push notifications"
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
          node -e 'const fs = require("node:fs"); JSON.parse(fs.readFileSync("google-services.json", "utf8"));
            const config = JSON.parse(fs.readFileSync("app.json", "utf8"));
            config.expo.android.googleServicesFile = "./google-services.json";
            fs.writeFileSync("app.json", JSON.stringify(config, null, 2) + "\n")'

      - name: expo prebuild
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install
        env:
          CI: "1"

      # The properties go in the generated android/gradle.properties (escaped for a properties file), where nothing
      # caches them.
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::A release's APK needs the signing key: set the repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD (docs/mobile.md)"
            exit 1
          fi
          keystore="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE" | base64 -d > "$keystore"
          node -e 'const [file, ...values] = process.argv.slice(1);
            const esc = (v) => v.replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/^\s/, "\\$&");
            const keys = ["store.file", "store.password", "key.alias", "key.password"];
            require("node:fs").appendFileSync(file, "\n" + keys.map((k, i) => `android.injected.signing.${k}=${esc(values[i])}\n`).join(""))' \
            apps/mobile/android/gradle.properties "$keystore" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"

      - name: Gradle
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      # The APK's signer, which must be the release key on a release (a Gradle that ignored the injected key would
      # otherwise ship one signed with the debug key).
      - name: APK
        run: |
          mkdir -p apps/mobile/release
          apk="apps/mobile/release/huntaway-$VERSION.apk"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "$apk"
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          if grep -q "CN=Android Debug" "$RUNNER_TEMP/certs.txt"; then
            echo "::error::The APK is signed with the debug key"
            exit 1
          fi
          ls -l "$apk"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: huntaway-android
          path: apps/mobile/release/*.apk
          if-no-files-found: error
          retention-days: 1

  # The builds' files, attached to the release (those that built, if one failed). On its own so that only this job,
  # which runs nothing from the repository, has write access.
  attach:
    if: ${{ !cancelled() }}
    needs: [build, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: huntaway-*
          path: release
          merge-multiple: true

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(release/*.{AppImage,pacman,dmg,zip,tar.gz,json,apk})
          ls -l "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
