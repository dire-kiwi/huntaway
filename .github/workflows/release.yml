# Builds the desktop app's Arch package (app/package.json's `build`) and, for a version tag (v1.2.3), publishes it
# to a GitHub release with its latest-linux.yml. Installed apps check the latest release and update themselves
# from it (app/electron/updater.cjs). Running it by hand builds the package without publishing, as an artifact.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  pacman:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      SCCACHE_DISABLE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      # fpm writes the package's .MTREE with bsdtar.
      - name: bsdtar
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      # The app's version comes from the tag (v1.2.3 → 1.2.3), and the updater compares it with the latest release's.
      - name: Version
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: app
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - name: npm ci
        working-directory: app
        run: npm ci --no-audit --no-fund

      - name: Build
        working-directory: app
        run: npm run build && (cd ../server && cargo build --release --locked)

      - name: Package and publish
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux pacman --publish always

      - name: Package
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: app
        run: npx electron-builder --linux pacman --publish never

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: huntaway-pacman
          path: |
            app/release/*.pacman
            app/release/latest-linux.yml
