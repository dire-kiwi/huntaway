# Builds the desktop app (app/package.json's `build`) and the server for Linux and macOS, and the mobile app's Android
# APK, when a GitHub release is published, and attaches them to that release. The release's tag is the version (v1.2.3 → 1.2.3), so it must be
# semver with an optional leading v. Running it by hand (Actions → Release → Run workflow) builds an existing
# release's tag again and replaces its files. A pull request that changes the packaging builds it too, as an
# artifact of the run, without a release. Only the attach job, which pull requests don't run, can write to the repository.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the release to build and attach the files to
        required: true
  pull_request:
    paths:
      - .github/workflows/release.yml
      - app/package.json
      - app/package-lock.json
      - app/electron/**
      - mobile/package.json
      - mobile/package-lock.json
      - mobile/app.json
      - mobile/app.config.*
      - mobile/eas.json
      - mobile/scripts/release-version.js
      - mobile/assets/**

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
            arch: x64
          - runner: macos-latest
            os: mac
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      SCCACHE_DISABLE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG && format('refs/tags/{0}', env.TAG) || '' }}

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      # fpm writes the Arch package's .MTREE with bsdtar.
      - name: bsdtar
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      # The app's version, and the server's (`huntaway --version`). A cargo command without --locked updates the
      # workspace's own entries in Cargo.lock, so that the --locked build passes, and leaves the dependencies alone.
      - name: Version
        working-directory: app
        run: |
          version="${TAG#v}"
          [ -n "$TAG" ] || version="0.0.0-pr.${{ github.event.number }}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          npm version --no-git-tag-version --allow-same-version "$version"
          cd ../server
          node -e 'const fs = require("node:fs"); const toml = fs.readFileSync("Cargo.toml", "utf8");
            fs.writeFileSync("Cargo.toml", toml.replace(/^version = ".*"$/m, `version = "${process.argv[1]}"`))' "$version"
          cargo metadata --format-version 1 >/dev/null
          grep -A1 '^name = "huntaway"$' Cargo.lock | grep -qxF "version = \"$version\""

      - name: npm ci
        working-directory: app
        run: npm ci --no-audit --no-fund

      # IA_BUILD_COMMIT: the server reports the commit it was built from, as a checkout does (a hub that updates
      # itself to a release goes by it to update hosts, and hosts that follow the hub with --update-from too).
      - name: Build
        working-directory: app
        run: npm run build && (cd ../server && IA_BUILD_COMMIT=$(git rev-parse HEAD) cargo build --release --locked)

      # Linux: an AppImage and an Arch package. macOS: a dmg and a zip, ad-hoc signed (there's no Developer ID).
      - name: Package the desktop app
        working-directory: app
        run: npx electron-builder --${{ matrix.os }} --${{ matrix.arch }} --publish never

      # What an installed app reads to update itself: the version, and the shell stamp (the frame stamp of
      # app/electron/stamp.cjs: boot.cjs and Electron) of the desktop app, which says whether the update needs a new
      # package or only changes the server, the UI and the rest of the shell (boot.cjs loads that from the server's
      # tarball). The stamp is checked against the one the packaged app computes from its app.asar, with its own Electron.
      - name: Release manifest
        if: matrix.os == 'linux'
        working-directory: app
        run: |
          node -e 'const fs = require("node:fs"); const { frameStamp } = require("./electron/stamp.cjs");
            const electron = require("./node_modules/electron/package.json").version;
            const manifest = { version: process.env.VERSION, shell: frameStamp("electron", electron), electron };
            fs.writeFileSync(`release/huntaway-${process.env.VERSION}-release.json`, JSON.stringify(manifest, null, 2) + "\n")'
          cat "release/huntaway-$VERSION-release.json"
          asar="$PWD/release/linux-unpacked/resources/app.asar/electron"
          packaged=$(ELECTRON_RUN_AS_NODE=1 release/linux-unpacked/huntaway-desktop -e \
            "console.log(require('$asar/stamp.cjs').frameStamp('$asar', process.versions.electron))")
          node -e 'const m = require(process.argv[1]); if (m.shell !== process.argv[2]) {
            console.error(`the packaged app has stamp ${process.argv[2]}, the manifest ${m.shell}`); process.exit(1) }' \
            "./release/huntaway-$VERSION-release.json" "$packaged"

      # The server on its own, for hosts: huntaway and ia-shim with the UI in ui/ beside them, where the server looks.
      # electron/ is the desktop shell of this release, which an installed app loads once it has updated to it
      # (app/electron/boot.cjs); shell.json says which Electron it was written for and which boot.cjs it needs.
      - name: Package the server
        run: |
          name="huntaway-server-$VERSION-${{ matrix.os }}-${{ matrix.arch }}"
          mkdir -p "app/release/$name"
          cp server/target/release/huntaway server/target/release/ia-shim "app/release/$name/"
          cp -R app/dist "app/release/$name/ui"
          mkdir "app/release/$name/electron"
          cp app/electron/*.cjs "app/release/$name/electron/"
          node -e 'const electron = require("./app/node_modules/electron/package.json").version;
            require("node:fs").writeFileSync(process.argv[1], JSON.stringify({ electron, boot: 1 }) + "\n")' "app/release/$name/electron/shell.json"
          tar -C app/release -czf "app/release/$name.tar.gz" "$name"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: huntaway-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            app/release/*.AppImage
            app/release/*.pacman
            app/release/*.dmg
            app/release/*.zip
            app/release/*.tar.gz
            app/release/*.json
          if-no-files-found: error
          retention-days: ${{ env.TAG && 1 || 7 }}

  # The mobile app's Android APK (mobile/), built here with `expo prebuild` and Gradle rather than on EAS: it needs no
  # Expo account or build quota, and the signing key stays in this repository's secrets. ANDROID_KEYSTORE_BASE64 is the
  # keystore (base64 of the .jks), with ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD; Gradle
  # gets them as android.injected.signing.* properties, as Android Studio passes them, so the generated build.gradle
  # needs no changes. A release needs the key, since phones only update an app signed with the same one. A pull
  # request's APK, an artifact of its run, is signed with the debug key of Expo's template instead: for trying, not for
  # keeping. Only the 32- and 64-bit ARM builds are in it, which every phone runs; x86 is for emulators.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG && format('refs/tags/{0}', env.TAG) || '' }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # React Native's Gradle plugin builds with a JDK 17 toolchain. The runner has the Android SDK and NDK; Gradle
      # downloads the versions it's missing.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.event_name != 'pull_request' }}

      - name: npm ci
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Version
        working-directory: mobile
        run: |
          version="${TAG#v}"
          [ -n "$TAG" ] || version="0.0.0-pr.${{ github.event.number }}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          node scripts/release-version.js "$version"

      - name: expo prebuild
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install
        env:
          CI: "1"

      # Only a release's APK gets the key, so a branch's code never runs with it. The properties go in the generated
      # android/gradle.properties (escaped for a properties file), where nothing caches them.
      - name: Signing key
        if: env.TAG
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::A release's APK needs the signing key: set the repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD (README: The mobile app)"
            exit 1
          fi
          keystore="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE" | base64 -d > "$keystore"
          node -e 'const [file, ...values] = process.argv.slice(1);
            const esc = (v) => v.replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/^\s/, "\\$&");
            const keys = ["store.file", "store.password", "key.alias", "key.password"];
            require("node:fs").appendFileSync(file, "\n" + keys.map((k, i) => `android.injected.signing.${k}=${esc(values[i])}\n`).join(""))' \
            mobile/android/gradle.properties "$keystore" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"

      - name: Gradle
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      # The APK's signer, which must be the release key on a release (a Gradle that ignored the injected key would
      # otherwise ship one signed with the debug key).
      - name: APK
        run: |
          mkdir -p mobile/release
          apk="mobile/release/huntaway-$VERSION.apk"
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "$apk"
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          if [ -n "$TAG" ] && grep -q "CN=Android Debug" "$RUNNER_TEMP/certs.txt"; then
            echo "::error::The APK is signed with the debug key"
            exit 1
          fi
          ls -l "$apk"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: huntaway-android
          path: mobile/release/*.apk
          if-no-files-found: error
          retention-days: ${{ env.TAG && 1 || 7 }}

  # The builds' files, attached to the release (those that built, if one failed). On its own so that only this job,
  # which runs nothing from the repository, has write access.
  attach:
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    needs: [build, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: huntaway-*
          path: release
          merge-multiple: true

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(release/*.{AppImage,pacman,dmg,zip,tar.gz,json,apk})
          ls -l "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
